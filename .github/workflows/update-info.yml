name: Update HSC info

on:
  schedule:
    - cron: "13 */5 * * *" # every 5 hours (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect notices, news and sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/fetch_updates.py
      - name: Save collected information
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json discovered_sources.json
          git diff --cached --quiet || git commit -m "Refresh HSC information"
          git push
