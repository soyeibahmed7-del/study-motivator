name: Update HSC info

on:
  schedule:
    - cron: "30 2 * * *"   # every day at 02:30 UTC = 08:30 Bangladesh time
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: write           # needed to save updates.json into the repository

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect notices and news
        run: python3 scripts/fetch_updates.py

      - name: Save updates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git diff --cached --quiet || git commit -m "Update HSC info"
          git push
