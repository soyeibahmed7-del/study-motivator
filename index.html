<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Motivator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Look & feel ---------- */
  :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --accent:#22c55e; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:"Noto Sans Bengali","Nirmala UI","Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  h1 { color:var(--accent); font-size:26px; margin:0 0 14px; }
  .card { background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:620px;
          min-height:170px; display:flex; align-items:center; justify-content:center; }
  #msg { font-size:21px; line-height:1.7; text-align:center; white-space:pre-line; margin:0; }
  #status { color:var(--muted); font-size:13px; margin-top:12px; min-height:18px; text-align:center; }
  .row { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; justify-content:center; }
  button { font-family:inherit; font-size:16px; border:0; border-radius:10px; padding:11px 24px; cursor:pointer; color:var(--text); background:#334155; }
  button.go { background:var(--accent); color:#052e16; font-weight:700; }
  button:hover { filter:brightness(1.12); }
  #gear { position:fixed; top:10px; right:12px; background:none; padding:6px 10px; font-size:20px; color:var(--muted); }
  #panel { display:none; position:fixed; inset:0; background:var(--bg); padding:20px; overflow:auto; }
  #panel .box { max-width:520px; margin:0 auto; }
  label { display:block; margin:12px 0 4px; color:var(--muted); font-size:14px; }
  input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #475569; background:var(--card); color:var(--text); font-size:15px; font-family:inherit; }
  pre { background:var(--card); padding:10px; border-radius:8px; font-size:12px; max-height:150px; overflow:auto; white-space:pre-wrap; }
  .bye { font-size:20px; text-align:center; }
</style>
</head>
<body>
  <button id="gear" title="Settings" onclick="openSettings()">⚙</button>
  <h1>আজকের অনুপ্রেরণা</h1>
  <div class="card"><p id="msg">একটু অপেক্ষা করো…</p></div>
  <div id="status"></div>
  <div class="row">
    <button class="go" onclick="closeApp()">Start Studying</button>
    <button onclick="speak(currentText)">🔊 শুনুন</button>
    <button onclick="closeApp()">Close</button>
  </div>

  <!-- Settings screen (opens automatically the first time) -->
  <div id="panel"><div class="box">
    <h1>Settings</h1>
    <label>Claude API key</label><input id="s_key" type="password" placeholder="sk-ant-...">
    <label>Your name</label><input id="s_name" placeholder="যেমন: রাহিম">
    <label>Voice</label>
    <select id="s_voice"><option value="female">Female (Nabanita)</option><option value="male">Male (Pradeep)</option></select>
    <label>Study subjects (comma separated)</label><input id="s_subj" placeholder="Math, Physics, English">
    <label>Model</label><input id="s_model">
    <label>Seconds to wait after login before starting</label><input id="s_delay" type="number" min="0">
    <label>Seconds before window auto-closes</label><input id="s_close" type="number" min="5">
    <div class="row">
      <button class="go" onclick="saveSettings()">Save &amp; Test</button>
      <button onclick="document.getElementById('panel').style.display='none'">Cancel</button>
    </div>
    <label>Error log</label><pre id="logbox"></pre>
    <p style="color:var(--muted);font-size:13px">Your key is saved only inside this browser on this laptop. It is never uploaded to GitHub.</p>
  </div></div>

<script>
/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// Simple error log (last 50 lines) - visible in Settings
function logErr(msg) {
  console.error(msg);
  const l = LS.get('sm_log', []); l.push(new Date().toLocaleString() + '  ' + msg); LS.set('sm_log', l.slice(-50));
}

/* ================= Settings ================= */
const DEFAULTS = { apiKey:'', name:'', voice:'female', subjects:'', model:'claude-haiku-5-5', startDelay:5, windowSeconds:30 };
const cfg = Object.assign({}, DEFAULTS, LS.get('sm_cfg', {}));

function openSettings() {
  stopCountdown();
  $('s_key').value = cfg.apiKey; $('s_name').value = cfg.name; $('s_voice').value = cfg.voice;
  $('s_subj').value = cfg.subjects; $('s_model').value = cfg.model;
  $('s_delay').value = cfg.startDelay; $('s_close').value = cfg.windowSeconds;
  $('logbox').textContent = LS.get('sm_log', []).join('\n') || '(no errors)';
  $('panel').style.display = 'block';
}
function saveSettings() {
  LS.set('sm_cfg', {
    apiKey: $('s_key').value.trim(), name: $('s_name').value.trim(), voice: $('s_voice').value,
    subjects: $('s_subj').value.trim(), model: $('s_model').value.trim() || DEFAULTS.model,
    startDelay: Number($('s_delay').value) || 0, windowSeconds: Number($('s_close').value) || 30
  });
  location.reload();
}

/* ================= Message generation ================= */
// A different "personality" is picked at random each time
const STYLES = [
  "a friendly close friend talking warmly","a strict but caring teacher",
  "a funny light joke that ends with a study push","a short 2-4 line poem (kobita) about studying and dreams",
  "a famous-style quote (original wording, do NOT attribute it to a real person)",
  "a message from the person's successful future self","an energetic sports coach before a big match",
  "a calm wise grandparent giving advice","a motivational speaker with a powerful punchy tone",
  "a gentle reminder from a loving older sibling"
];

function buildPrompt(history, style) {
  const h = new Date().getHours();
  const part = h < 12 ? 'morning' : h < 17 ? 'afternoon' : h < 21 ? 'evening' : 'night';
  const recent = history.length ? history.map(m => '- ' + m).join('\n') : '(none yet)';
  return `Write ONE fresh motivational message in natural, correct Bangla (Bengali script) to push a student to start studying right now.

Style for this message: ${style}
Student's name: ${cfg.name || '(no name given)'}
Student's subjects: ${cfg.subjects || '(none given)'}
Time of day: ${part}

Rules:
- 2 to 3 short sentences (a poem may be up to 4 short lines).
- Natural spoken Bangla, simple words, correct spelling and grammar.
- You may mention the name (and sometimes a subject), but not every time and only if given.
- No emojis, no English words, no quotation marks, no markdown, no explanation.
- Output ONLY the message text.
- It must be clearly different in wording and idea from these recent messages:
${recent}`;
}

async function askClaude(history) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);   // give up after 20 s
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: ctrl.signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': cfg.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'   // needed to call the API from a web page
      },
      body: JSON.stringify({
        model: cfg.model, max_tokens: 400, temperature: 1,
        messages: [{ role: 'user', content: buildPrompt(history, STYLES[Math.floor(Math.random() * STYLES.length)]) }]
      })
    });
    if (!res.ok) {
      const err = new Error('API error ' + res.status + ': ' + (await res.text()).slice(0, 200));
      err.fatal = res.status >= 400 && res.status < 500 && res.status !== 429 && res.status !== 408; // wrong key etc: don't retry
      throw err;
    }
    const data = await res.json();
    const text = (data.content[0].text || '').trim().replace(/^["“”]+|["“”]+$/g, '');
    if (!/[\u0980-\u09FF]/.test(text)) throw Object.assign(new Error('Reply was not Bangla'), { fatal: true });
    if (history.includes(text)) throw new Error('Repeated an old message');
    return text;
  } finally { clearTimeout(timer); }
}

function offlineMessage(history) {
  const fresh = OFFLINE.filter(m => !history.includes(m));
  const pool = fresh.length ? fresh : OFFLINE;
  const t = pool[Math.floor(Math.random() * pool.length)];
  return cfg.name && Math.random() < 0.5 ? cfg.name + ', ' + t : t;
}

async function getMessage(history) {
  if (cfg.apiKey) {
    const deadline = Date.now() + 30000;       // wait up to 30 s for the internet to connect
    while (true) {
      try { return { text: await askClaude(history), source: 'AI' }; }
      catch (e) {
        logErr('Claude: ' + e.message);
        if (e.fatal || Date.now() > deadline) break;
        $('status').textContent = 'ইন্টারনেটের জন্য অপেক্ষা করছি…';
        await sleep(3000);
      }
    }
  } else logErr('No API key set - using offline message');
  return { text: offlineMessage(history), source: 'offline' };
}

/* ================= Voice (browser's built-in Bangla voice) ================= */
function whenVoicesReady() {
  return new Promise(resolve => {
    if (speechSynthesis.getVoices().length) return resolve();
    speechSynthesis.onvoiceschanged = () => resolve();
    setTimeout(resolve, 3000);
  });
}
function pickVoice() {
  const bn = speechSynthesis.getVoices().filter(v => /^bn/i.test(v.lang) || /bengali|bangla/i.test(v.name));
  if (!bn.length) return null;
  const want = cfg.voice === 'male' ? /pradeep|bashkar|\bmale\b/i : /nabanita|tanishaa|\bfemale\b/i;
  return bn.find(v => /bn-BD/i.test(v.lang) && want.test(v.name)) || bn.find(v => want.test(v.name)) ||
         bn.find(v => /bn-BD/i.test(v.lang)) || bn[0];
}
let currentText = '';
function speak(text) {
  if (!text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'bn-BD'; u.rate = 0.95;
  const v = pickVoice(); if (v) u.voice = v;
  u.onerror = e => { if (e.error !== 'canceled' && e.error !== 'interrupted') {
      logErr('Voice error: ' + e.error);
      $('status').textContent = 'শব্দ বন্ধ থাকলে “🔊 শুনুন” বোতাম চাপো।'; } };
  speechSynthesis.speak(u);
}

/* ================= Countdown & closing ================= */
let timer = null;
function startCountdown() {
  let left = cfg.windowSeconds;
  timer = setInterval(() => {
    if (left <= 0) { closeApp(); return; }
    $('status').textContent = left + ' সেকেন্ড পরে এটি বন্ধ হয়ে যাবে';
    left--;
  }, 1000);
}
function stopCountdown() { clearInterval(timer); }
function closeApp() {
  stopCountdown(); speechSynthesis.cancel();
  window.close();    // works in Edge app window; if blocked, show a note
  setTimeout(() => { document.body.innerHTML = '<p class="bye">এই উইন্ডোটি এখন বন্ধ করে দিতে পারো। শুভ পড়াশোনা! 📚</p>'; }, 400);
}

/* ================= Main ================= */
(async function main() {
  if (!cfg.apiKey) openSettings();                      // first time: ask for key
  await sleep(cfg.startDelay * 1000);                   // wait a few seconds after login
  const history = LS.get('sm_history', []);
  const { text, source } = await getMessage(history);
  LS.set('sm_history', history.concat(text).slice(-30)); // keep last 30
  await whenVoicesReady();

  currentText = text;
  $('msg').textContent = text;                          // show text ...
  speak(text);                                          // ... and speak at the same moment
  $('status').textContent = source === 'AI' ? '' : '(offline বার্তা)';
  if (!pickVoice()) $('status').textContent = 'বাংলা ভয়েস পাওয়া যায়নি — Microsoft Edge ব্যবহার করো।';
  if ($('panel').style.display !== 'block') startCountdown();
})();
</script>
